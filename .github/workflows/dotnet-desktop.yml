name: Publish Chantry

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: 6.0.x

    - name: Create the app package
      run: dotnet publish Chantry/Chantry.csproj -c Release -r win-x64 -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:PublishTrimmed=true --self-contained true --output ./publish
      run: dotnet publish Chantry/Chantry.csproj -c Release -r osx-x64 -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:PublishTrimmed=true --self-contained true --output ./publish
      
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v3
      with:
        name: chantry-win-x64
        path: ./publish/Chantry.exe

    - name: Upload MacOS artifact
      uses: actions/upload-artifact@v3
      with:
        name: chantry-osx-x64
        path: ./publish/Chantry
